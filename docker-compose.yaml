services:
  db:
    image: postgres:16
    env_file: .env
    volumes: 
      - dados_do_estoque:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radarstock"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://radar:radar@db:5432/radarstock
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./web
    environment:
      API_URL: http://api:3001
    ports: 
      - "3000:3000"
    depends_on:
      - api
volumes: 
  dados_do_estoque: