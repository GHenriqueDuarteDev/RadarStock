services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - dados_do_estoque:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radarstock"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://radar:radar@db:5432/radarstock
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    volumes:
      - ./api:/app/api
      - api_node_modules:/app/api/node_modules
      - ./contracts:/app/contracts
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_URL: http://api:3001
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app/web
      - web_node_modules:/app/web/node_modules
      - ./contracts:/app/contracts
    depends_on:
      - api
volumes:
  dados_do_estoque:
  web_node_modules:
  api_node_modules:
